
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вгадай тваринку 🐾</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(135deg, #fff3b0, #ffd6e7, #c9f4ff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
}

.game {
    width: 100%;
    max-width: 650px;
    background: white;
    border-radius: 35px;
    padding: 30px 20px;
    box-shadow: 0 12px 30px #0002;
    position: relative;
    overflow: hidden;
}

h1 {
    color: #ff7b54;
    font-size: clamp(30px, 7vw, 45px);
    margin: 5px 0;
}

.subtitle {
    color: #777;
    font-size: 18px;
}

.score {
    display: inline-block;
    background: #fff0a8;
    padding: 12px 25px;
    border-radius: 30px;
    font-size: 21px;
    font-weight: bold;
    color: #8a6200;
    margin: 15px;
}

.progress {
    height: 12px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    margin: 10px 5px 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #55cf91;
    transition: width .4s;
}

.question {
    background: #e6f7ff;
    padding: 25px 15px;
    border-radius: 25px;
    font-size: clamp(23px, 5vw, 30px);
    font-weight: bold;
    color: #397b9c;
    margin-bottom: 25px;
    min-height: 110px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.animal {
    border: 4px solid transparent;
    border-radius: 25px;
    background: #fff1d6;
    padding: 15px 5px;
    cursor: pointer;
    transition: transform .2s, background .2s;
    font-size: 65px;
    min-height: 135px;
}

.animal span {
    display: block;
    font-size: 19px;
    font-weight: bold;
    color: #555;
    margin-top: 5px;
}

.animal:hover {
    transform: scale(1.06);
    background: #ffe3a8;
}

.animal:active {
    transform: scale(.95);
}

.animal:disabled {
    cursor: default;
}

.correct {
    background: #b9f7ca !important;
    border-color: #40c878;
    animation: bounce .6s;
}

.wrong {
    background: #ffc9c9 !important;
    border-color: #ff6565;
    animation: shake .35s;
}

.feedback {
    font-size: 25px;
    font-weight: bold;
    min-height: 45px;
    margin: 20px 0 5px;
    color: #ff8c42;
}

.next, .restart {
    border: none;
    background: #ff8b65;
    color: white;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 35px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 5px 0 #dc6847;
    margin-top: 10px;
}

.next:hover, .restart:hover {
    background: #ff704b;
}

.hidden {
    display: none;
}

.celebration {
    font-size: 65px;
    animation: bounce .7s infinite alternate;
}

@keyframes bounce {
    0% { transform: scale(1); }
    100% { transform: scale(1.2) rotate(5deg); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

@keyframes confetti {
    0% { transform: translateY(-20px) rotate(0); opacity: 1; }
    100% { transform: translateY(150px) rotate(360deg); opacity: 0; }
}

.confetti {
    position: absolute;
    top: 0;
    font-size: 25px;
    pointer-events: none;
    animation: confetti 1.5s forwards;
}

@media(max-width: 400px) {
    .animal {
        font-size: 52px;
        min-height: 120px;
    }
    .animal span {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🐾 Вгадай тваринку! 🐾</h1>
    <div class="subtitle">Весела гра для маленьких розумників!</div>

    <div class="score">
        ⭐ Правильні відповіді: <span id="score">0</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div id="gameScreen">
        <div class="question" id="question">
            Хто любить їсти банан? 🍌
        </div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next hidden" id="nextBtn" onclick="nextQuestion()">
            Наступне запитання ➡️
        </button>
    </div>

    <div id="endScreen" class="hidden">
        <div class="celebration">🏆🎉🐻</div>
        <h1>Молодець!</h1>
        <p style="font-size:25px;color:#777">
            Ти завершив усі завдання!
        </p>
        <div class="score">
            ⭐ Твій результат: <span id="finalScore">0</span>
        </div>
        <br>
        <button class="restart" onclick="restartGame()">
            🔄 Грати ще раз!
        </button>
    </div>

</div>

<script>
const animals = [
    {name: "Мавпочка", emoji: "🐒"},
    {name: "Собачка", emoji: "🐶"},
    {name: "Зайчик", emoji: "🐰"},
    {name: "Котик", emoji: "🐱"}
];

const questions = [
    {
        text: "Хто любить їсти банан? 🍌",
        answer: "Мавпочка"
    },
    {
        text: "Хто живе у будці? 🏠",
        answer: "Собачка"
    },
    {
        text: "Хто любить їсти морквинку? 🥕",
        answer: "Зайчик"
    },
    {
        text: "Хто каже «Няв-няв»? 🐾",
        answer: "Котик"
    },
    {
        text: "Хто стрибає по деревах? 🌳",
        answer: "Мавпочка"
    },
    {
        text: "Хто охороняє наш дім? 🏡",
        answer: "Собачка"
    },
    {
        text: "У кого довгі вушка? 👂",
        answer: "Зайчик"
    },
    {
        text: "Хто любить пити молочко? 🥛",
        answer: "Котик"
    },
    {
        text: "Хто має пухнастий хвостик і любить гратися з клубочком? 🧶",
        answer: "Котик"
    },
    {
        text: "Хто любить гризти моркву? 🥕",
        answer: "Зайчик"
    }
];

let current = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");
const nextBtn = document.getElementById("nextBtn");

function speak(text) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "uk-UA";
    speech.rate = 0.9;
    speech.pitch = 1.2;

    window.speechSynthesis.speak(speech);
}

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function loadQuestion() {
    answered = false;

    const q = questions[current];

    questionEl.textContent = q.text;
    feedbackEl.textContent = "";
    nextBtn.classList.add("hidden");

    answersEl.innerHTML = "";

    progressEl.style.width =
        (current / questions.length * 100) + "%";

    shuffle(animals).forEach(animal => {
        const button = document.createElement("button");

        button.className = "animal";
        button.innerHTML =
            `${animal.emoji}<span>${animal.name}</span>`;

        button.onclick = () => checkAnswer(animal.name, button);

        answersEl.appendChild(button);
    });
}

function checkAnswer(name, button) {
    if (answered) return;

    const correct = questions[current].answer;

    if (name === correct) {
        answered = true;
        score++;

        scoreEl.textContent = score;

        button.classList.add("correct");

        feedbackEl.textContent = "🎉 УРА! ТИ МОЛОДЕЦЬ! ⭐";

        speak("Ура! Молодець! Чудова відповідь!");

        createConfetti();

        document.querySelectorAll(".animal").forEach(btn => {
            btn.disabled = true;
        });

        nextBtn.classList.remove("hidden");

    } else {
        button.classList.add("wrong");

        feedbackEl.textContent = "😊 Спробуй ще раз!";

        speak("Спробуй ще раз! Ти зможеш!");
        
        setTimeout(() => {
            button.classList.remove("wrong");
        }, 500);
    }
}

function createConfetti() {
    const game = document.querySelector(".game");
    const symbols = ["⭐", "🎉", "💛", "🌈", "✨"];

    for (let i = 0; i < 15; i++) {
        const item = document.createElement("div");

        item.className = "confetti";
        item.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];

        item.style.left = Math.random() * 95 + "%";
        item.style.animationDelay = Math.random() * 0.5 + "s";

        game.appendChild(item);

        setTimeout(() => item.remove(), 2000);
    }
}

function nextQuestion() {
    current++;

    if (current < questions.length) {
        loadQuestion();
    } else {
        finishGame();
    }
}

function finishGame() {
    document.getElementById("gameScreen").classList.add("hidden");
    document.getElementById("endScreen").classList.remove("hidden");

    document.getElementById("finalScore").textContent =
        score + " / " + questions.length;

    progressEl.style.width = "100%";

    speak("Вітаю! Ти пройшов усі завдання! Ти справжній розумник!");
}

function restartGame() {
    current = 0;
    score = 0;

    scoreEl.textContent = "0";

    document.getElementById("gameScreen").classList.remove("hidden");
    document.getElementById("endScreen").classList.add("hidden");

    loadQuestion();

    speak("Починаємо нову гру! Успіхів!");
}

loadQuestion();
</script>

</body>
</html>
